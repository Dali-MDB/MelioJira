[package]
name = "melio-jira"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.0", features = ["v4", "serde"] }
sqlx = {
    version = "0.8",
    features = [
        "runtime-tokio",
        "mysql"
    ]
}
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
validator = { version = "0.19", features = ["derive"] }

#for auth
argon2 = "0.5"
bcrypt = "0.16"
jsonwebtoken = "10"

futures-util = "0.3"

